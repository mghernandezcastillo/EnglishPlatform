    <text x="98" y="140" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Numbers, Ages &amp; Birthdays</text>
    <text x="102" y="330" fill="#FFFFFF" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="138">🔢</text>
    <text x="388" y="310" fill="#FFFFFF" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="106">🎂</text>
