    <rect x="42" y="44" width="556" height="136" rx="32" fill="#ffffff20" stroke="#FFFFFF22"/>
    <rect x="42" y="206" width="256" height="332" rx="34" fill="#ffffff20" stroke="#FFFFFF22"/>
